name: Qualified extension candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Candidate channel
        type: choice
        options: [alpha, preview]
        default: alpha

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_CHANNEL: ${{ inputs.channel || 'alpha' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch official Blender 5.1.1 portable runtime
        shell: pwsh
        run: |
          python -B tools/fetch_ci_blender.py --output-dir outputs/ci-blender
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime verification failed' }
          $runtime = Get-Content outputs/ci-blender/runtime.json -Raw | ConvertFrom-Json
          "BLENDER_BINARY=$($runtime.binary)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLENDER_PYTHON=$($runtime.python)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare existing pinned build tools and scientific wheels
        shell: pwsh
        run: |
          New-Item outputs/process-temp -ItemType Directory -Force | Out-Null
          $env:TEMP = Join-Path $PWD 'outputs/process-temp'
          $env:TMP = $env:TEMP
          python -m pip install --no-deps --target outputs/build-site -r tools/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned developer build tools failed' }
          & $env:BLENDER_PYTHON -B tools/fetch_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw 'Locked scientific wheel download failed' }
          $env:PYTHONPATH = Join-Path $PWD 'outputs/build-site'
          & $env:BLENDER_PYTHON -B tools/build_science_backend.py
          if ($LASTEXITCODE -ne 0) { throw 'Locked GBasis build failed' }
          Remove-Item Env:PYTHONPATH
          $lock = Get-Content dependencies.lock.json -Raw | ConvertFrom-Json
          $backend = Get-Content outputs/backend-wheel.json -Raw | ConvertFrom-Json
          $wheels = @($lock.packages) + @($backend) | ForEach-Object { Join-Path "$PWD/outputs/wheels" $_.filename }
          python -m pip install --no-index --no-deps --target outputs/science $wheels
          if ($LASTEXITCODE -ne 0) { throw 'Isolated locked scientific wheel imports failed' }
          git diff --exit-code -- dependencies.lock.json science-sources.lock.json tools/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Source locks changed during build' }
      - name: Run public numerical tests, native qualification and public reproduction
        shell: pwsh
        run: |
          & $env:BLENDER_PYTHON -I -B tools/run_candidate_ci.py --blender $env:BLENDER_BINARY --run-id $env:GITHUB_RUN_ID --channel $env:CANDIDATE_CHANNEL
          if ($LASTEXITCODE -ne 0) { throw 'Current-batch candidate qualification failed' }
          $candidate = Get-Content outputs/candidate-ci/artifact/release-manifest.json -Raw | ConvertFrom-Json
          "CANDIDATE_ARTIFACT_NAME=$($candidate.artifact_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload immutable qualified candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: outputs/candidate-ci/artifact/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30
      - name: Record upload identity outside the candidate
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.candidate.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: |
          "Candidate artifact: $env:CANDIDATE_ARTIFACT_NAME" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Artifact ID: $env:ARTIFACT_ID" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Artifact digest: $env:ARTIFACT_DIGEST" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Artifact URL: $env:ARTIFACT_URL" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qcblender-ci-failure-${{ github.run_id }}
          path: |
            outputs/candidate-ci/logs/
            outputs/candidate-ci/commands.json
            outputs/candidate-ci/reports/
          if-no-files-found: ignore
          retention-days: 7
