name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'validation/human/**'
      - 'validation/agent/packages/qcblender-public-tutorial-samples-v*.zip'
      - 'validation/agent/acceptance/tutorial-sample-delivery.json'
      - 'validation/agent/current-install.json'
      - 'validation/shared/data/public/**'
      - 'docs/USER_GUIDE.md'
      - 'qcblender/blender_manifest.toml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'validation/human/**'
      - 'validation/agent/packages/qcblender-public-tutorial-samples-v*.zip'
      - 'validation/agent/acceptance/tutorial-sample-delivery.json'
      - 'validation/agent/current-install.json'
      - 'validation/shared/data/public/**'
      - 'docs/USER_GUIDE.md'
      - 'qcblender/blender_manifest.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Require this already-published preview and preserve its exact repository index
        default: ""
        type: string

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install locked website dependencies
        run: npm ci --no-audit
      - name: Prepare and check the website
        env:
          GH_TOKEN: ${{ github.token }}
          QCB_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          npm run prepare:docs
          npm run check
          npm test
          # prepare:docs already ran before checking; bypass only npm's duplicate prebuild hook.
          npm exec --no -- astro build
          npm run verify
      - name: Upload static website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
